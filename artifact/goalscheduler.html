<title>GoalScheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: phone-first single column (max 720px). Sticky header, plain list rows for moves,
   cards only for goals/projects/crew, fixed five-slot tab bar with a center capture button. */
:root {
  --bg: #EDF1EB;        /* sage paper */
  --surface: #FFFFFF;
  --raise: #FFFFFF;     /* selected segment */
  --sunk: #E1E8DF;
  --ink: #13261F;       /* pine ink */
  --ink-2: #47594F;
  --ink-3: #6F8078;
  --line: #D2DBD0;
  --pine: #1E5A44;      /* primary */
  --on-pine: #FFFFFF;
  --gold: #E3A01A;      /* energy accent */
  --gold-soft: #F8EBCB;
  --on-gold: #2A1D04;
  --good: #2F7D4F;
  --warn: #9A620E;
  --bad: #B3433A;
  --scrim: rgba(10, 20, 15, .45);
  --shadow: 0 1px 2px rgba(19,38,31,.06), 0 6px 18px rgba(19,38,31,.07);
  --a-work: #2C79BC; --a-money: #2B9464; --a-body: #D05A36; --a-mind: #8767CC;
  --a-people: #C94C82; --a-growth: #13969A; --a-fun: #CF9010; --a-impact: #788A2F;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 14px;
  --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1411; --surface: #151F1A; --raise: #34463D; --sunk: #1C2822; --ink: #E3ECE7; --ink-2: #A6B6AE; --ink-3: #7F8F87;
    --line: #2A3832; --pine: #5DC295; --on-pine: #08120D; --gold: #F0B437; --gold-soft: #33290F; --on-gold: #1D1403;
    --good: #5DC295; --warn: #E7AA4A; --bad: #EF7D72; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.4);
    --a-work: #5BA2E0; --a-money: #4CC08A; --a-body: #EE7D58; --a-mind: #A78BEA;
    --a-people: #E879A9; --a-growth: #3CC1C4; --a-fun: #E8B43A; --a-impact: #A3B455;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #151F1A; --raise: #34463D; --sunk: #1C2822; --ink: #E3ECE7; --ink-2: #A6B6AE; --ink-3: #7F8F87;
  --line: #2A3832; --pine: #5DC295; --on-pine: #08120D; --gold: #F0B437; --gold-soft: #33290F; --on-gold: #1D1403;
  --good: #5DC295; --warn: #E7AA4A; --bad: #EF7D72; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.4);
  --a-work: #5BA2E0; --a-money: #4CC08A; --a-body: #EE7D58; --a-mind: #A78BEA;
  --a-people: #E879A9; --a-growth: #3CC1C4; --a-fun: #E8B43A; --a-impact: #A3B455;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: default; }
input, select, textarea { font-size: 16px; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-3); }

.shell { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }
.page { display: grid; gap: 4px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-inline: -16px; padding: 10px 16px; background: var(--bg); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.mark { width: 24px; height: 24px; border-radius: 7px; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; }
.mark svg { width: 15px; height: 15px; stroke-width: 3.2; }
.top-r { display: flex; align-items: center; gap: 8px; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill-gold { background: var(--gold-soft); color: var(--warn); }

/* Type */
.display { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .95; text-wrap: balance; }
.h-xl { font-size: clamp(44px, 13vw, 64px); }
.h-l { font-size: 36px; }
.h-m { font-size: 24px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.hint { font-size: 13.5px; color: var(--ink-3); }
.why { font-size: 14.5px; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }

/* Sections */
.sec { display: grid; gap: 10px; padding-block: 18px 4px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; flex-wrap: wrap; }

/* Banners & empties */
.banner { border: 1px solid var(--line); background: var(--gold-soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-block: 4px 8px; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r-card); color: var(--ink-2); display: grid; gap: 10px; justify-items: start; }
.win { color: var(--good); font-weight: 700; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; transition: background .15s, transform .1s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; }
.btn-pri { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
.btn-gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn-ai { background: var(--gold-soft); border-color: transparent; color: var(--ink); }
.btn-ai svg { color: var(--warn); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--pine); padding-inline: 4px; }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--pine); font-weight: 600; padding-block: 12px 4px; justify-self: start; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Chips & segmented */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroller { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.chips.scroller::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; }
.chip .av { margin-left: -6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 36px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--ink-2); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: var(--shadow); }
.seg .muted { font-weight: 600; }

/* Areas */
.area { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.area i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }

/* Avatars */
.av { border-radius: 50%; flex: none; object-fit: cover; display: inline-grid; place-items: center; color: #fff; font-weight: 700; overflow: hidden; background: var(--ink-3); }

/* Rows */
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding-block: 9px; border-bottom: 1px solid var(--line); min-height: 54px; }
.list > .row:last-child, .list > .carry:last-child .row { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; padding-block: 2px; }
.row-title { font-weight: 500; overflow-wrap: anywhere; }
.row.done .row-title { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row-meta { font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.ctx { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
.ctx i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.key { color: var(--gold); display: inline-flex; vertical-align: -2px; margin-right: 5px; }
.late { color: var(--bad); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }
.check { position: relative; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink-3); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.check::before { content: ""; position: absolute; inset: -9px; }
.check svg { width: 15px; height: 15px; stroke-width: 3.2; }
.check.on { background: var(--pine); border-color: var(--pine); color: var(--on-pine); animation: pop .25s ease-out; }
@keyframes pop { 50% { transform: scale(1.18); } }

.adder { display: flex; align-items: center; gap: 12px; padding-block: 6px; min-height: 50px; }
.adder-plus { width: 26px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.adder input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; outline: none; }
.adder input::placeholder { color: var(--ink-3); }
.adder:focus-within .adder-plus { color: var(--pine); }

.carry { display: grid; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.carry .row { border-bottom: 0; }
.carry-acts { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 38px; }
.slip { padding-left: 38px; font-size: 13px; color: var(--warn); font-weight: 600; padding-bottom: 6px; }

/* Forms */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, .textarea, .select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-ctl); padding: 10px 12px; min-height: 46px; }
.textarea { resize: vertical; min-height: 84px; line-height: 1.45; display: block; }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--pine); outline-offset: -1px; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.select-inline { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; min-height: 32px; max-width: 100%; }
.form { display: grid; gap: 14px; }
.title-input { width: 100%; border: 0; background: transparent; padding: 2px 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 9vw, 46px); text-transform: uppercase; line-height: 1; border-bottom: 2px solid transparent; }
.title-input:focus { outline: none; border-bottom-color: var(--gold); }
.why-input { background: transparent; }

/* Today */
.today-h { display: grid; gap: 8px; padding-block: 8px 6px; }
.today-stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 14px; color: var(--ink-2); }
.today-stats .over { color: var(--bad); font-weight: 600; }
.bar { display: block; height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--pine); border-radius: inherit; transition: width .35s ease; }
.bar.gold > i { background: var(--gold); }
.words { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.word { width: 100%; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; text-align: center; border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 6px 2px; border-radius: 0; }
.word::placeholder { color: var(--ink-3); opacity: .45; }
.word:focus { outline: none; border-bottom-color: var(--gold); }
.big3 { display: grid; gap: 8px; }
.slot { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px 8px 12px; min-height: 60px; width: 100%; }
.slot-n { font-family: var(--f-display); font-weight: 800; font-size: 30px; color: var(--gold); width: 18px; text-align: center; line-height: 1; flex: none; }
.slot.empty { border-style: dashed; background: transparent; color: var(--ink-3); font-weight: 600; }
.slot.done .row-title { color: var(--ink-3); text-decoration: line-through; }
.crew-strip { display: flex; gap: 8px; }
.crew-chip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.crew-chip-t { display: grid; line-height: 1.15; font-size: 12.5px; color: var(--ink-3); }
.crew-chip-t b { color: var(--ink); font-size: 13.5px; }

details.fold { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 0; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { transition: transform .2s; color: var(--ink-3); display: grid; }
details.fold[open] > summary .chev { transform: rotate(90deg); }
.fold-body { display: grid; gap: 12px; padding-bottom: 8px; }
.grat { display: grid; gap: 8px; }
.rate { display: grid; gap: 6px; padding-block: 8px; }
.rate-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rate-top b { font-weight: 700; }
.rate-q { font-size: 13px; color: var(--ink-3); }
.dots5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.dots5 button { height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
.dots5 button[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
.score-row { display: flex; align-items: baseline; gap: 8px; padding-block: 4px; }
.score { font-size: 52px; color: var(--pine); }
.score-mini { font-weight: 700; color: var(--pine); font-variant-numeric: tabular-nums; }

/* Week */
.nav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 12px 2px; }
.nav-title { font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; text-align: center; flex: 1; min-width: 0; }
.nav-sub { display: flex; justify-content: center; gap: 12px; font-size: 13.5px; color: var(--ink-3); }
.wday { display: grid; padding-block: 14px 0; }
.wday-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 2px; border-bottom: 2px solid var(--ink); }
.wday-name { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.wday.is-today .wday-h { border-bottom-color: var(--pine); }
.wday.is-today .wday-name { color: var(--pine); }
.wday.is-past { opacity: .78; }
.wday-load { margin-left: auto; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.wday-load.over { color: var(--bad); font-weight: 700; }
.focus { display: grid; gap: 8px; }
.fcard { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.fcard-main { flex: 1; min-width: 0; display: grid; gap: 4px; text-align: left; }
.fcard-t { font-weight: 600; overflow-wrap: anywhere; }
.daypick { display: flex; gap: 4px; padding-left: 38px; padding-bottom: 8px; flex-wrap: wrap; }
.daypick button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; }
.daypick button.today { border-color: var(--pine); color: var(--pine); }
.ready .row { border-bottom: 0; }
.ready > div { border-bottom: 1px solid var(--line); }

/* Month */
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mhead { font-size: 11px; font-weight: 700; color: var(--ink-3); text-align: center; letter-spacing: .06em; padding-bottom: 2px; }
.mcell { min-height: 54px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); padding: 4px 5px; display: grid; grid-template-rows: auto 1fr; gap: 2px; text-align: left; min-width: 0; font-variant-numeric: tabular-nums; }
.mcell.out { opacity: .38; }
.mcell.today { border-color: var(--pine); box-shadow: inset 0 0 0 1px var(--pine); }
.mcell[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.mcell-top { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
.mnum { font-size: 13px; font-weight: 700; }
.mdue { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: none; }
.mdots { display: flex; flex-wrap: wrap; gap: 2px; align-content: end; }
.mdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); opacity: .7; }
.mdots i.d { background: var(--pine); opacity: 1; }
.mcell[aria-pressed="true"] .mdots i { background: var(--bg); }
.mscore { font-size: 10px; color: var(--ink-3); font-weight: 700; }
.mcell[aria-pressed="true"] .mscore { color: var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--pine); display: inline-block; }
.legend i.o { background: var(--ink-3); }
.legend i.g { background: var(--gold); border-radius: 0; transform: rotate(45deg); }

/* Year */
.theme-input { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: transparent; font-family: var(--f-display); font-weight: 800; font-size: clamp(32px, 9vw, 44px); text-transform: uppercase; padding: 4px 0; border-radius: 0; }
.theme-input:focus { outline: none; border-bottom-color: var(--gold); }
.theme-input::placeholder { color: var(--ink-3); opacity: .45; }
.areas { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.acard { display: grid; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; border-top: 3px solid var(--c); }
.acard-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.acard .textarea { min-height: 64px; border-color: transparent; background: var(--sunk); padding: 8px 10px; font-size: 15px; }
.tl { display: grid; }
.tl-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); align-items: start; }
.tl-m { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; color: var(--ink-3); padding-top: 2px; }
.tl-row.now .tl-m { color: var(--pine); }
.tl-goals { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: center; }
.gchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; max-width: 100%; text-align: left; }
.gchip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.gchip.done { color: var(--ink-3); text-decoration: line-through; }

/* Projects */
.pgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.pcard { display: grid; gap: 10px; align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; transition: border-color .15s, transform .1s; }
.pcard:hover { border-color: var(--ink-3); }
.pcard:active { transform: scale(.99); }
.pcard-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  { key: 'energy',       label: 'Energy',       q: 'Did I protect my energy: sleep, food, movement, breaks?' },

/* ───────────── Store ───────────── */

const PRINCIPLES = `You are the planning coach inside GoalScheduler, a planner that a group of friends share. Coach with two frameworks:
- Tony Robbins' Rapid Planning Method (RPM): a goal is a Result (a specific, checkable outcome), a Purpose (the emotional reason it is a must), and a Massive Action Plan (the concrete actions). Chunk related actions under one result, and mark the vital few actions that drive most of the result.
- Brendon Burchard's High Performance Habits: seek clarity, generate energy, raise necessity, increase productivity by naming the major moves, develop influence, demonstrate courage.
Write plainly and specifically, in the person's own vocabulary. Results are concrete ("Book 20 color appointments a week by March 1", not "Grow the salon"). Actions start with a verb and fit in one sitting (5 to 120 minutes).`;

let aiOff = false;
const aiReady = () => !!S.ai && !aiOff && !S.readOnly;
async function ask(prompt, opts) {
  if (!S.ai || aiOff) throw { code: 'not_granted' };
  try { return await S.ai.json(prompt, opts || {}); }
  catch (e) {
    if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) { aiOff = true; emit(); }
    throw e;

}
function aiError(e) {
  switch (e && e.code) {
    case 'cancelled': return '';
    case 'not_granted': return 'Claude is off for this page. You can allow it from the page’s Permissions menu.';
    case 'rate_limited': return 'Claude is busy or you hit a usage limit. Try again in a minute.';
    case 'invalid_json': return 'Claude’s answer came back in the wrong shape. Try again.';
    case 'session_expired': return 'Sign in to Claude again, then retry.';
    case 'refused': return 'Claude couldn’t help with that one. Try rewording it.';
    case 'prompt_too_large': return 'There’s too much here for one request. Try a smaller piece.';
    default: return 'Couldn’t reach Claude. Try again.';
  }
}
function projectContext(p) {
  const lines = projectGoals(p.id).map((g) => {
    const acts = goalActions(g.id);
    const done = acts.filter((a) => a.done).length;
    let s = `- [${g.status}] ${g.kind === 'mini' ? 'Mini-project' : 'Goal'}: "${g.title}"${g.due ? ` (due ${g.due})` : ''}`;
    if (g.why) s += `\n  Purpose: ${g.why}`;
    if (acts.length) s += `\n  Actions (${done}/${acts.length} done): ${acts.slice(0, 12).map((a) => (a.done ? '[x] ' : '[ ] ') + a.title).join('; ')}`;
    return s;
  });
  const loose = actions().filter((a) => a.projectId === p.id && !a.goalId);
  return `Project: "${p.title}" (life area: ${(AREA[p.area] || AREA.work).label})
Purpose / vision: ${p.why || '(not written yet)'}
Goals and mini-projects so far:
${lines.join('\n') || '(none yet)'}${loose.length ? `\nLoose actions in this project: ${loose.slice(0, 15).map((a) => a.title).join('; ')}` : ''}`;
}
const cleanActions = (list, max = 8) => (Array.isArray(list) ? list : []).slice(0, max)
  .map((a) => ({ title: str(a && a.title, 160), minutes: clampMin(a && a.minutes), key: !!(a && a.key), sel: true }))

async function suggestGoals(p, steer, fresh, signal) {
  const prompt = `${PRINCIPLES}

Today is ${longDate(todayIso())}.

${projectContext(p)}
${steer ? `\nWhat the person wants next: ${steer}\n` : ''}
Suggest 3 new goals or mini-projects for this project that build on what is already here: take the next logical step after finished goals, fill obvious gaps, and stay true to the project's purpose and to the way its goals are written. Do not repeat or reword existing goals. Use "mini" for a multi-step piece of work with its own scope, and "goal" for an outcome to hit.

Reply with only JSON in this shape:
{"suggestions":[{"kind":"goal","title":"Result, specific and measurable","why":"Purpose in one or two sentences, in the person's voice","dueInDays":30,"actions":[{"title":"Verb-first action","minutes":30,"key":true}]}]}
Give each suggestion 3 to 6 actions and mark 1 or 2 of them as key.`;
  const opts = { signal };
  if (fresh) opts.cache = false;
  const r = await ask(prompt, opts);
  const list = Array.isArray(r && r.suggestions) ? r.suggestions : Array.isArray(r) ? r : [];
  return list.slice(0, 5).map((s) => ({

}

function normDay(v) {

async function sortDump(text, signal) {
  const t = todayIso();
  const ps = projects().filter((p) => (p.status || 'active') === 'active').slice(0, 30);
  const ctx = ps.map((p) => {

  }).join('\n');
  const prompt = `${PRINCIPLES}

Today is ${fmt(t, { weekday: 'long' })} ${t}.

The person's active projects and goals:
${ctx || '(none yet)'}

Their brain dump:
"""
${text.slice(0, 6000)}
"""

Chunk it RPM-style. For each distinct item in the dump, decide where it belongs:
- an action under an existing goal (set goalId),
- an action under an existing project with no matching goal (set projectId),
- a new goal under an existing project (type "goal", set projectId, include its actions),
- or a new goal inside a new project (type "goal", set newProject with a title and area).
Small one-off errands can be actions with no goalId or projectId.
Set "day" from the dump's own timing words as an ISO date (YYYY-MM-DD), or null when no timing was given.
Area must be one of: ${AREAS.map((a) => a.key).join(', ')}.

Reply with only JSON:
{"items":[{"type":"action","title":"...","minutes":30,"day":null,"goalId":null,"projectId":null,"newProject":null,"why":null,"actions":[]}]}`;
  const r = await ask(prompt, { signal, cache: false });
  const items = Array.isArray(r && r.items) ? r.items : [];
  return items.slice(0, 40).map((it) => {
    const goalId = it && C('goals').has(it.goalId) ? it.goalId : null;
    const projectId = it && C('projects').has(it.projectId) ? it.projectId : goalId ? C('goals').get(goalId).projectId : null;
    const np = !goalId && !projectId && it && it.newProject && str(it.newProject.title, 80)

    const type = it && it.type === 'goal' && (projectId || np) ? 'goal' : 'action';
    return {
      sel: true, type, title: str(it && it.title, 160), minutes: clampMin(it && it.minutes), day: normDay(it && it.day),
      goalId: type === 'action' ? goalId : null, projectId, newProject: np, why: str(it && it.why, 500),
      actions: type === 'goal' ? cleanActions(it && it.actions) : [],
    };
  }).filter((x) => x.title);
}

let profBusy = false;
async function refreshProfiles() {

  const ids = new Set(crewIds());
  for (const col of ['projects', 'goals', 'actions']) for (const x of C(col).values()) if (x.ownerId) ids.add(x.ownerId);

  if (!list.length) return;
  profBusy = true;
  try {
    const ps = await S.user.profiles(list);
    let changed = false;
    for (const id of list) {
      const p = ps && ps[id];
      if (!p) continue;
      const old = S.profiles[id];
      if (!old || old.name !== p.name || old.avatarUrl !== p.avatarUrl || old.color !== p.color) {
        S.profiles[id] = { name: p.name, avatarUrl: p.avatarUrl, color: p.color }; changed = true;

    }
    if (changed) emit();
  } catch (e) { /* profiles never reject by contract */ }

}

// Text input that keeps its own draft while focused and saves after a pause or on blur.
function Auto({ value, onSave, multiline, cls = 'input', placeholder, id, rows, maxLength = 500, label, disabled }) {
  const [v, setV] = useState(value || '');
  const focused = useRef(false);
  const timer = useRef(null);
  const latest = useRef(value || '');
  latest.current = value || '';
  useEffect(() => { if (!focused.current) setV(value || ''); }, [value]);
  useEffect(() => () => clearTimeout(timer.current), []);
  const save = (nv) => { clearTimeout(timer.current); if (nv !== latest.current) onSave(nv); };
  const props = {
    id, class: cls, value: v, placeholder, maxLength, disabled, 'aria-label': label,
    onInput: (e) => { const nv = e.currentTarget.value; setV(nv); clearTimeout(timer.current); timer.current = setTimeout(() => save(nv), 900); },
    onFocus: () => { focused.current = true; },
    onBlur: (e) => { focused.current = false; save(e.currentTarget.value); },
  };
  return multiline
    ? html`<textarea rows=${rows || 3} ...${props}></textarea>`
    : html`<input type="text" autocomplete="off" enterkeyhint="done" onKeyDown=${(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} ...${props}/>`;
}

    ${tab('projects', 'Projects', 'stack')}
    ${tab('crew', 'Crew', 'crew')}

function Sheet({ title, children, foot }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const onKey = (e) => { if (e.key === 'Escape') closeSheet(); };
    document.addEventListener('keydown', onKey);
    const ov = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    if (ref.current && !ref.current.contains(document.activeElement)) ref.current.focus({ preventScroll: true });
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ov; if (prev && prev.focus) prev.focus({ preventScroll: true }); };
  }, []);
  return html`<div class="scrim" onClick=${closeSheet}></div>
  <div class=${'sheet' + (foot ? ' has-foot' : '')} role="dialog" aria-modal="true" aria-label=${title} ref=${ref} tabindex="-1">
    <div class="sheet-scroll">
      <div class="sheet-h"><h2 class="display h-m">${title}</h2><button class="icon-btn" aria-label="Close" onClick=${closeSheet}><${Ic} n="x"/></button></div>
      <div class="sheet-body">${children}</div>
    </div>
    ${foot && html`<div class="sheet-foot">${foot}</div>`}
  </div>`;
}

/* ───────────── Today ───────────── */

function big3Candidates() {
  const t = todayIso(), me = S.me;
  const focus = new Set((getLog(me, 'w-' + weekStart(t)) || {}).focus || []);
  const rank = (a) => (a.key ? 4 : 0) + (a.day && a.day < t ? 2 + Math.min(a.carried || 0, 3) : 0) + (a.day === t ? 3 : 0) + (focus.has(a.goalId) ? 2 : 0);
  return actions().filter((a) => a.ownerId === me && !a.done && (a.day ? a.day <= addDays(t, 1) : a.key || focus.has(a.goalId)))
    .sort((x, y) => rank(y) - rank(x) || byOrder(x, y));
}

function TodayView() {
  const [aiBusy, setAiBusy] = useState(false);
  const [aiMsg, setAiMsg] = useState('');
  const t = todayIso(), me = S.me, ro = S.readOnly || !me;
  const key = 'd-' + t;
  const day = getLog(me, key) || {};
  const all = actions();
  const mineToday = all.filter((a) => a.ownerId === me && a.day === t);
  const carried = all.filter((a) => a.ownerId === me && a.day && a.day < t && !a.done).sort((x, y) => x.day.localeCompare(y.day));
  const big = [0, 1, 2].map((i) => { const id = (day.big3 || [])[i]; return id && C('actions').has(id) ? id : null; });
  const bigSet = new Set(big.filter(Boolean));
  const bigFilled = bigSet.size;
  const bigDone = [...bigSet].filter((id) => C('actions').get(id).done).length;
  const rest = mineToday.filter((a) => !bigSet.has(a.id)).sort(byDone);
  const todayAll = [...mineToday, ...[...bigSet].map((id) => C('actions').get(id)).filter((a) => a.day !== t)];
  const doneN = todayAll.filter((a) => a.done).length;
  const planned = todayAll.reduce((s, a) => s + (a.minutes || 30), 0);
  const cap = capOf(me);
  const ratings = day.ratings || {};
  const score = scoreOf(day);
  const evening = new Date().getHours() >= 17;
  const loading = S.mode === 'loading' || (S.mode === 'live' && !LOADED.has('actions'));

  async function pickBig3() {
    setAiBusy(true); setAiMsg('');
    try {
      const cands = big3Candidates().filter((a) => !bigSet.has(a.id)).slice(0, 30);
      if (!cands.length) { setAiMsg('Add a few moves first (or star key moves in your projects), then Claude can pick.'); return; }
      const focus = ((getLog(me, 'w-' + weekStart(t)) || {}).focus || []).map((id) => C('goals').get(id)).filter(Boolean);
      const prompt = `${PRINCIPLES}

Today is ${longDate(t)}.
This week's outcomes: ${focus.map((g) => `"${g.title}"`).join(', ') || '(none set)'}
${bigFilled ? `Already in today's Big 3: ${[...bigSet].map((id) => C('actions').get(id).title).join('; ')}\n` : ''}
Candidate actions:
${cands.map((a) => { const g = a.goalId && C('goals').get(a.goalId); const p = projectOf(a); return `- id=${a.id} | ${a.title} | ${p ? p.title : 'no project'}${g ? ' / ' + g.title : ''} | ${a.minutes || 30} min${a.key ? ' | KEY' : ''}${a.day && a.day < t ? ` | planned ${a.day}, moved ${a.carried || 0}x` : ''}${g && g.due ? ` | goal due ${g.due}` : ''}`; }).join('\n')}

Pick the ${3 - bigFilled} action(s) that would make today a win. Favor key actions, this week's outcomes, near deadlines, and anything that keeps slipping. Keep the total realistic for one day.

Reply with only JSON: {"ids":["id"],"why":"one short sentence"}`;
      const r = await ask(prompt, { modelTier: 'quick', cache: false });
      const ids = (Array.isArray(r && r.ids) ? r.ids : []).filter((id) => C('actions').has(id) && !bigSet.has(id));
      const free = [0, 1, 2].filter((i) => !big[i]);
      ids.slice(0, free.length).forEach((id, n) => setBig(free[n], id));
      setAiMsg(ids.length ? str(r && r.why, 240) : 'Claude didn’t find a clear pick. Choose one yourself.');
    } catch (e) { setAiMsg(aiError(e)); }
    finally { setAiBusy(false); }
  }

  const setWord = (i, v) => { const w = [...((getLog(me, key) || {}).words || ['', '', ''])]; while (w.length < 3) w.push(''); w[i] = v.trim(); saveLog(key, { words: w, date: t }); };
  const setGrat = (i, v) => { const w = [...((getLog(me, key) || {}).grateful || ['', '', ''])]; while (w.length < 3) w.push(''); w[i] = v.trim(); saveLog(key, { grateful: w, date: t }); };
  const rate = (k, n) => { const r = { ...((getLog(me, key) || {}).ratings || {}) }; if (r[k] === n) delete r[k]; else r[k] = n; saveLog(key, { ratings: r, date: t }); };

  return html`<div class="page">
    <header class="today-h">
      <div class="label">${fmt(t, { weekday: 'long' })} · Week ${isoWeek(t)} · Day ${dayOfYear(t)}</div>
      <h1 class="display h-xl">${fmt(t, { month: 'long', day: 'numeric' })}</h1>
      <div class="today-stats">
        <span><b class="num">${doneN}</b> of <b class="num">${todayAll.length}</b> moves done</span>
        <span class=${planned > cap ? 'over' : ''}>${mins(planned)} planned of ${mins(cap)}</span>
      </div>
      <div class="bar"><i style=${{ '--p': String(todayAll.length ? doneN / todayAll.length : 0) }}></i></div>
    </header>

    <${CrewStrip} t=${t}/>

    <section class="sec">
      <h2 class="label">Who I want to be today</h2>
      <div class="words">${[0, 1, 2].map((i) => html`<${Auto} key=${'w' + i} id=${'word' + i} cls="word" value=${(day.words || [])[i] || ''} placeholder=${['Focused', 'Bold', 'Generous'][i]} label=${'Word ' + (i + 1) + ' for who you want to be today'} maxLength=${18} disabled=${ro} onSave=${(v) => setWord(i, v)}/>`)}</div>
    </section>

    <section class="sec">
      <div class="sec-h">
        <h2 class="label">Big 3 · moves that make today a win</h2>
        ${aiReady() && bigFilled < 3 && html`<button class="btn btn-sm btn-ai" disabled=${aiBusy} onClick=${pickBig3}><${Ic} n="spark" s=${16}/>${aiBusy ? 'Picking…' : 'Help me pick'}</button>`}
      </div>
      <div class="big3">${big.map((id, i) => id
        ? html`<${BigSlot} key=${'b' + i} i=${i} a=${C('actions').get(id)} t=${t}/>`
        : html`<button key=${'e' + i} class="slot empty" disabled=${ro} onClick=${() => openSheet('big3', { slot: i })}><span class="slot-n" aria-hidden="true">${i + 1}</span><span>Choose a move</span></button>`)}</div>
      ${bigFilled === 3 && bigDone === 3 && html`<p class="win">Big 3 done. Today’s a win.</p>`}
      ${aiMsg && html`<p class="hint" role="status">${aiMsg}</p>`}
    </section>

    ${carried.length > 0 && html`<section class="sec">
      <div class="sec-h"><h2 class="label">Carried over · ${carried.length}</h2></div>
      <p class="hint">Unfinished moves from earlier days. Decide: today, tomorrow, or someday.</p>
      <div class="list">${carried.map((a) => html`<${CarryRow} key=${a.id} a=${a} t=${t}/>`)}</div>
    </section>`}

    <section class="sec">
      <h2 class="label">${bigFilled ? 'Also today' : 'Today'}</h2>
      ${loading
        ? html`<p class="hint">Loading your moves…</p>`
        : !rest.length && !bigFilled && html`<p class="hint">Nothing planned for today yet. Add a move below, or open a project and schedule one.</p>`}
      <div class="list">${rest.map((a) => html`<${ActionRow} key=${a.id} a=${a}/>`)}</div>
      <${Adder} id="today-add" placeholder="Add a move for today (try “Call supplier 15m”)" onAdd=${(q) => newAction({ ...q, day: t })}/>
    </section>

    <details class="fold">
      <summary><span class="label">Morning priming · gratitude</span><span class="chev"><${Ic} n="chevR" s=${18}/></span></summary>
      <div class="fold-body">
        <p class="hint">Three things you’re grateful for. Start from gratitude, then go.</p>
        <div class="grat">${[0, 1, 2].map((i) => html`<${Auto} key=${'g' + i} id=${'grat' + i} value=${(day.grateful || [])[i] || ''} placeholder=${'Grateful for…'} label=${'Gratitude ' + (i + 1)} maxLength=${200} disabled=${ro} onSave=${(v) => setGrat(i, v)}/>`)}</div>
      </div>
    </details>

    <details class="fold" open=${evening || score > 0}>
      <summary><span class="label">Evening review · six habits</span><span class="score-mini">${score ? score + '/30' : ''}</span></summary>
      <div class="fold-body">
        <p class="hint">Rate today from 1 to 5 on each high performance habit. The trend matters more than any single day.</p>
        ${HABITS.map((hb) => html`<div class="rate" key=${hb.key}>
          <div class="rate-top"><b>${hb.label}</b><span class="rate-q">${hb.q}</span></div>
          <div class="dots5" role="group" aria-label=${hb.label + ' rating'}>${[1, 2, 3, 4, 5].map((n) => html`<button aria-pressed=${String(ratings[hb.key] === n)} disabled=${ro} onClick=${() => rate(hb.key, n)}>${n}</button>`)}</div>
        </div>`)}
        <div class="score-row"><span class="display score num">${score}</span><span class="hint">of 30 · high performance score</span></div>
        <label class="field"><span>Today’s win</span><${Auto} multiline id="win" cls="textarea" rows=${2} value=${day.win} placeholder="What went right? Say it out loud." label="Today's win" maxLength=${600} disabled=${ro} onSave=${(v) => saveLog(key, { win: v.trim(), date: t })}/></label>
        <label class="field"><span>Lesson or adjustment</span><${Auto} multiline id="lesson" cls="textarea" rows=${2} value=${day.lesson} placeholder="What will you do differently tomorrow?" label="Lesson" maxLength=${600} disabled=${ro} onSave=${(v) => saveLog(key, { lesson: v.trim(), date: t })}/></label>
      </div>
    </details>
  </div>`;
}

    </button>

function CarryRow({ a, t }) {
  const late = dayDiff(a.day, t);
  const c = a.carried || 0;
  return html`<div class="carry">
    <${ActionRow} a=${a} extra=${{ text: late === 1 ? 'from yesterday' : `${late} days late`, cls: 'late' }}/>

    ${!S.readOnly && html`<div class="carry-acts">
      <button class="btn btn-sm" onClick=${() => moveTo(a, t)}>Do today</button>
      <button class="btn btn-sm" onClick=${() => moveTo(a, addDays(t, 1))}>Tomorrow</button>

      ${c >= 2 && aiReady() && html`<button class="btn btn-sm btn-ai" onClick=${() => openSheet('breakdown', { id: a.id })}><${Ic} n="spark" s=${15}/>Break it down</button>`}
    </div>`}
  </div>`;
}

function CrewStrip({ t }) {
  const others = crewIds().filter((id) => id !== S.me);

    const bd = b.filter((x) => C('actions').get(x).done).length;

}

function WeekView() {
  const [showAll, setShowAll] = useState(false);
  const t = todayIso();
  const ws = UI.weekOf || weekStart(t), we = addDays(ws, 6);
  const uid = whoId();
  const addUid = uid || S.me;
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const acts = actions().filter((a) => !uid || a.ownerId === uid);
  const wk = acts.filter((a) => a.day && a.day >= ws && a.day <= we);
  const byDay = groupBy(wk, (a) => a.day);
  const people = uid ? [uid] : crewIds();
  const focus = [];
  for (const p of people) for (const gid of ((getLog(p, 'w-' + ws) || {}).focus || [])) if (C('goals').has(gid)) focus.push({ g: C('goals').get(gid), p });
  const focusSet = new Set(focus.map((x) => x.g.id));
  const canLog = UI.who === 'me' && !S.readOnly && !!S.me;
  const wlog = getLog(S.me, 'w-' + ws) || {};
  const open = acts.filter((a) => !a.done && !a.day);
  const ready = [...open.filter((a) => focusSet.has(a.goalId)).sort(byDone), ...open.filter((a) => !focusSet.has(a.goalId)).sort(byDone)];
  const shown = showAll ? ready : ready.slice(0, 8);
  const cap = capOf(addUid);
  const isThis = ws === weekStart(t);

  return html`<div>
    <div class="nav-row">
      <button class="icon-btn" aria-label="Previous week" onClick=${() => ui({ weekOf: addDays(ws, -7) })}><${Ic} n="chevL"/></button>
      <div class="nav-title">${fmt(ws, { month: 'short', day: 'numeric' })} – ${fmt(we, ws.slice(5, 7) === we.slice(5, 7) ? { day: 'numeric' } : { month: 'short', day: 'numeric' })}</div>
      <button class="icon-btn" aria-label="Next week" onClick=${() => ui({ weekOf: addDays(ws, 7) })}><${Ic} n="chevR"/></button>
    </div>
    <div class="nav-sub"><span>Week ${isoWeek(ws)}</span><span class="num">${wk.filter((a) => a.done).length}/${wk.length} moves done</span>${!isThis && html`<button class="btn-ghost btn btn-sm" onClick=${() => ui({ weekOf: null })}>This week</button>`}</div>

    <section class="sec">
      <div class="sec-h"><h2 class="label">Outcomes this week</h2>${canLog && html`<button class="btn btn-sm" onClick=${() => openSheet('focus', { week: ws })}><${Ic} n="plus" s=${16}/>Choose</button>`}</div>
      ${focus.length
        ? html`<div class="focus">${focus.map(({ g, p }) => { const ga = goalActions(g.id); const pr = progress(ga); const proj = C('projects').get(g.projectId); return html`<div class="fcard" key=${p + g.id}>
            <button class="fcard-main" onClick=${() => openSheet('goal', { id: g.id })}>
              <span class="fcard-t">${g.title}</span>
              <span class="row-meta">${proj && html`<span class="ctx"><i style=${{ background: areaColor(proj.area) }}></i>${proj.title}</span>`}<span class="num">${pr.d}/${pr.t} moves</span>${g.due && html`<span class=${dueCls(g)}>${dueText(g.due)}</span>`}</span>
              <span class="bar gold"><i style=${{ '--p': String(g.status === 'done' ? 1 : pr.pct) }}></i></span>
            </button>
            ${!uid && html`<${Avatar} uid=${p} size=${24}/>`}
            ${canLog && html`<button class="icon-btn" aria-label=${'Remove outcome: ' + g.title} onClick=${() => saveLog('w-' + ws, { week: ws, focus: (wlog.focus || []).filter((x) => x !== g.id) })}><${Ic} n="x" s=${16}/></button>`}
          </div>`; })}</div>`
        : html`<div class="empty"><span>Pick the 3 to 5 results that would make this a great week. Their moves show up below, ready to schedule.</span>${canLog && html`<button class="btn btn-sm btn-pri" onClick=${() => openSheet('focus', { week: ws })}>Choose outcomes</button>`}</div>`}
    </section>

    ${days.map((d) => { const list = (byDay.get(d) || []).sort(byDone); const load = list.reduce((s, a) => s + (a.minutes || 30), 0); return html`<section key=${d} class=${'wday' + (d === t ? ' is-today' : '') + (d < t ? ' is-past' : '')} aria-label=${longDate(d)}>
      <div class="wday-h"><span class="wday-name">${fmt(d, { weekday: 'short' })} ${parse(d).getDate()}</span>${d === t && html`<span class="label" style="color:var(--pine)">Today</span>`}<span class=${'wday-load' + (load > cap ? ' over' : '')}>${list.length ? `${mins(load)} / ${mins(cap)}` : ''}</span></div>
      <div class="list">${list.map((a) => html`<${ActionRow} key=${a.id} a=${a} extra=${d < t && !a.done ? { text: 'not done', cls: 'late' } : null}/>`)}</div>
      ${d >= t && html`<${Adder} placeholder="Add a move" onAdd=${(q) => newAction({ ...q, day: d, ownerId: addUid })}/>`}
    </section>`; })}

    <section class="sec">
      <div class="sec-h"><h2 class="label">Ready to schedule · ${ready.length}</h2></div>
      ${ready.length
        ? html`<div class="list ready">${shown.map((a) => html`<div key=${a.id}>
            <${ActionRow} a=${a}/>
            ${!S.readOnly && html`<div class="daypick" role="group" aria-label=${'Schedule ' + a.title}>${days.map((d) => html`<button class=${d === t ? 'today' : ''} disabled=${d < t} aria-label=${'Schedule for ' + longDate(d)} onClick=${() => patchDoc('actions', a.id, { day: d })}>${fmt(d, { weekday: 'narrow' })}</button>`)}</div>`}
          </div>`)}</div>
          ${ready.length > shown.length && html`<button class="btn btn-ghost" onClick=${() => setShowAll(true)}>Show all ${ready.length}</button>`}`
        : html`<p class="hint">No unscheduled moves. Open a project to plan its moves, or use the + button.</p>`}
    </section>

    ${canLog && html`<details class="fold">
      <summary><span class="label">Weekly review</span><span class="chev"><${Ic} n="chevR" s=${18}/></span></summary>
      <div class="fold-body">
        <label class="field"><span>Wins this week</span><${Auto} multiline id="wk-wins" cls="textarea" value=${wlog.wins} placeholder="What moved? Celebrate it." label="Wins this week" maxLength=${1000} onSave=${(v) => saveLog('w-' + ws, { week: ws, wins: v.trim() })}/></label>
        <label class="field"><span>Lessons</span><${Auto} multiline id="wk-lessons" cls="textarea" value=${wlog.lessons} placeholder="What got in the way? What will you change?" label="Lessons" maxLength=${1000} onSave=${(v) => saveLog('w-' + ws, { week: ws, lessons: v.trim() })}/></label>
        <label class="field"><span>Next week’s must</span><${Auto} multiline id="wk-next" cls="textarea" value=${wlog.next} placeholder="The one result that has to happen next week." label="Next week's must" maxLength=${600} onSave=${(v) => saveLog('w-' + ws, { week: ws, next: v.trim() })}/></label>
      </div>
    </details>`}
  </div>`;
}

function MonthView() {
  const t = todayIso();
  const mk = UI.monthOf || t.slice(0, 7);
  const first = mk + '-01';
  const start = weekStart(first), nextFirst = addMonths(first, 1);
  const cells = [];
  for (let d = start; d < nextFirst || cells.length % 7; d = addDays(d, 1)) cells.push(d);
  const uid = whoId();
  const logUid = uid || S.me;
  const acts = actions().filter((a) => a.day && a.day >= cells[0] && a.day <= cells[cells.length - 1] && (!uid || a.ownerId === uid));
  const byDay = groupBy(acts, (a) => a.day);
  const due = goals().filter((g) => g.due && g.due.startsWith(mk) && (!uid || g.ownerId === uid)).sort((a, b) => a.due.localeCompare(b.due));
  const dueDays = new Set(due.map((g) => g.due));
  const sel = UI.selDay && UI.selDay.startsWith(mk) ? UI.selDay : t.startsWith(mk) ? t : first;
  const selActs = (byDay.get(sel) || []).sort(byDone);
  const mlog = getLog(logUid, 'm-' + mk) || {};

}

function YearView() {
  const t = todayIso();
  const y = UI.year || +t.slice(0, 4);
  const key = 'y-' + y;
  const uid = whoId();

  const isThisYear = y === +t.slice(0, 4);

  return html`<div>

      <div class="nav-title">${y}</div>
      <button class="icon-btn" aria-label="Next year" onClick=${() => ui({ year: y + 1 })}><${Ic} n="chevR"/></button>
    </div>
    <div class="nav-sub"><span class="num">${yearGoals.filter((g) => g.status === 'done').length}/${yearGoals.length} goals done</span>${isThisYear && html`<span class="num">Day ${dayOfYear(t)} of ${daysInYear(y)}</span>`}</div>
    <div class="bar gold" style="margin-top:8px" aria-label=${Math.round(elapsed * 100) + '% of the year gone'}><i style=${{ '--p': String(elapsed) }}></i></div>

      <h2 class="label">Theme for ${y}</h2>

        ? html`<${Auto} id="y-theme" cls="theme-input" value=${ylog.theme} placeholder="The year of…" label=${'Theme for ' + y} maxLength=${60} onSave=${(v) => saveLog(key, { year: y, theme: v.trim() })}/>`

    </section>

    <section class="sec">
      <h2 class="label">Vision by life area</h2>

      <div class="areas">${AREAS.map((a) => { const ap = ps.filter((p) => (p.area || 'work') === a.key); const ag = gs.filter((g) => g.status === 'active' && ap.some((p) => p.id === g.projectId)); return html`<div class="acard" key=${a.key} style=${{ '--c': areaColor(a.key) }}>
        <div class="acard-h"><${AreaTag} k=${a.key}/><span class="hint num">${ap.length} proj · ${ag.length} goals</span></div>
        ${canLog
          ? html`<${Auto} multiline id=${'vis-' + a.key} cls="textarea" rows=${2} value=${(ylog.visions || {})[a.key]} placeholder="It’s December. I…" label=${'Vision for ' + a.label} maxLength=${500} onSave=${(v) => saveLog(key, { year: y, visions: { ...((getLog(S.me, key) || {}).visions || {}), [a.key]: v.trim() } })}/>`
          : html`<p class="why">${(ylog.visions || {})[a.key] || 'Not written.'}</p>`}
      </div>`; })}</div>
    </section>

    <section class="sec">
      <h2 class="label">Deadlines across the year</h2>
      <div class="tl">${Array.from({ length: 12 }, (_, m) => { const mk = `${y}-${pad(m + 1)}`; const list = yearGoals.filter((g) => g.due.startsWith(mk)).sort((a, b) => a.due.localeCompare(b.due)); return html`<div key=${mk} class=${'tl-row' + (mk === curMonth ? ' now' : '')}>
        <button class="tl-m" aria-label=${'Open ' + fmt(mk + '-01', { month: 'long' })} onClick=${() => ui({ plan: 'month', monthOf: mk, selDay: null })}>${fmt(mk + '-01', { month: 'short' })}</button>
        <div class="tl-goals">${list.map((g) => { const p = C('projects').get(g.projectId); return html`<button key=${g.id} class=${'gchip' + (g.status === 'done' ? ' done' : '')} onClick=${() => openSheet('goal', { id: g.id })}><i style=${{ background: areaColor(p && p.area) }}></i>${g.title}</button>`; })}</div>
      </div>`; })}</div>
      ${undated.length > 0 && html`<p class="hint">${undated.length} active goal${undated.length === 1 ? ' has' : 's have'} no deadline. A result without a date is a wish; give ${undated.length === 1 ? 'it' : 'them'} one.</p>`}

  </div>`;

}

  const wk = actions().filter((a) => a.ownerId === uid && a.day && a.day >= ws && a.day <= we);
  const projs = projects().filter((p) => (p.status || 'active') === 'active' && p.ownerId === uid).length;
  const st = streak(uid);
  const val = uid === S.me ? 'me' : uid;
  return html`<article class="card ccard">

function SuggestSheet({ projectId, steer: initialSteer }) {
  const [steer, setSteer] = useState(initialSteer || '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [items, setItems] = useState(null);
  const [added, setAdded] = useState({});
  const ctl = useRef(null);
  const ran = useRef(0);
  useEffect(() => () => ctl.current && ctl.current.abort(), []);
  const p = C('projects').get(projectId);
  if (!p) return html`<${Sheet} title="Suggestions"><p class="hint">This project was deleted.</p><//>`;
  const run = async () => {
    if (ctl.current) ctl.current.abort();
    ctl.current = new AbortController();
    setBusy(true); setErr('');
    try { const list = await suggestGoals(p, steer.trim(), ran.current++ > 0, ctl.current.signal); setItems(list); setAdded({}); if (!list.length) setErr('Claude didn’t return any goals. Try again with a hint.'); }
    catch (e) { const m = aiError(e); if (m) setErr(m); }
    finally { setBusy(false); }
  };
  const take = (s, i) => {
    const sel = { ...s, actions: s.actions.filter((a) => a.sel) };
    if (addGoalWithActions(p.id, sel)) { setAdded({ ...added, [i]: true }); toast('Goal added to ' + p.title); }
  };
  return html`<${Sheet} title=${'Next goals for ' + p.title}>
    <p class="hint">Claude reads this project’s purpose and every goal in it, then suggests what comes next.</p>
    <label class="field"><span>Steer it (optional)</span><input id="sg-steer" class="input" value=${steer} onInput=${(e) => setSteer(e.currentTarget.value)} placeholder="e.g. more Instagram bookings, hire a stylist" maxLength="300" onKeyDown=${(e) => { if (e.key === 'Enter' && !busy) run(); }}/></label>
    ${busy
      ? html`<${Thinking} text=${'Claude is reading ' + p.title + '…'} onStop=${() => ctl.current && ctl.current.abort()}/>`
      : html`<button class="btn btn-ai" style="justify-self:start" onClick=${run}><${Ic} n="spark" s=${16}/>${items ? 'Suggest different ones' : 'Suggest 3 goals'}</button>`}
    ${err && html`<p class="err" role="alert">${err}</p>`}
    ${items && items.length > 0 && html`<div class="props">${items.map((s, i) => html`<div class="prop" key=${i}>
      <div class="prop-h"><div>
        <span class="kind">${s.kind === 'mini' ? 'Mini-project' : 'Goal'} · ${dueText(s.due)}</span>
        <b>${s.title}</b>
        ${s.why && html`<p class="why">${s.why}</p>`}
      </div></div>
      <ul>${s.actions.map((a, j) => html`<li key=${j}><label class="tick" style="border:0;padding:2px 0;flex:1"><input type="checkbox" checked=${a.sel} disabled=${added[i]} onChange=${() => { const next = items.slice(); next[i] = { ...s, actions: s.actions.map((x, k) => (k === j ? { ...x, sel: !x.sel } : x)) }; setItems(next); }}/><span><span>${a.key && html`<span class="key"><${Ic} n="star" s=${13} fill/></span>`}${a.title}</span></span></label><span class="num">${mins(a.minutes)}</span></li>`)}</ul>
      ${added[i] ? html`<p class="win">Added</p>` : html`<button class="btn btn-pri btn-sm" style="justify-self:start" onClick=${() => take(s, i)}><${Ic} n="plus" s=${15}/>Add to ${p.title}</button>`}
    </div>`)}</div>`}
  <//>`;
}

// Shared by "Plan moves" (goal) and "Break it down" (slipping move).
function ProposalSheet({ title, intro, load, apply, applyLabel, busyText }) {
  const [busy, setBusy] = useState(true);
  const [err, setErr] = useState('');
  const [items, setItems] = useState([]);
  const ctl = useRef(null);
  const n = useRef(0);
  const run = async () => {
    if (ctl.current) ctl.current.abort();
    ctl.current = new AbortController();
    setBusy(true); setErr('');
    try { const list = await load(n.current++ > 0, ctl.current.signal); setItems(list); if (!list.length) setErr('Claude didn’t return any moves. Try again.'); }
    catch (e) { const m = aiError(e); if (m) setErr(m); }
    finally { setBusy(false); }
  };
  useEffect(() => { run(); return () => ctl.current && ctl.current.abort(); }, []);
  const chosen = items.filter((x) => x.sel);
  return html`<${Sheet} title=${title} foot=${!busy && items.length > 0 && html`<button class="btn btn-pri" disabled=${!chosen.length} onClick=${() => { apply(chosen); closeSheet(); }}>${applyLabel(chosen.length)}</button><button class="btn" onClick=${run}>Try again</button>`}>
    ${intro && html`<p class="hint">${intro}</p>`}
    ${busy && html`<${Thinking} text=${busyText} onStop=${() => ctl.current && ctl.current.abort()}/>`}
    ${err && html`<p class="err" role="alert">${err}</p>`}
    ${!busy && err && !items.length && html`<button class="btn" style="justify-self:start" onClick=${run}>Try again</button>`}
    ${!busy && items.length > 0 && html`<div>${items.map((a, i) => html`<label class="tick" key=${i}>
      <input type="checkbox" checked=${a.sel} onChange=${() => setItems(items.map((x, k) => (k === i ? { ...x, sel: !x.sel } : x)))}/>
      <span><span>${a.key && html`<span class="key"><${Ic} n="star" s=${13} fill/></span>`}${a.title}</span><span class="hint num">${mins(a.minutes)}${a.key ? ' · key move' : ''}</span></span>
    </label>`)}</div>`}
  <//>`;
}

function CaptureSheet() {
  const [text, setText] = useState('');
  const [day, setDay] = useState(todayIso());
  const [target, setTarget] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [items, setItems] = useState(null);
  const ctl = useRef(null);
  useEffect(() => { const el = document.getElementById('cap-text'); if (el) el.focus({ preventScroll: true }); return () => ctl.current && ctl.current.abort(); }, []);
  const lines = text.split('\n').map((s) => s.replace(/^[-*•\d.)\s]+/, '').trim()).filter(Boolean);
  const quickAdd = () => {
    lines.forEach((l) => newAction({ ...parseQuick(l), day, ...targetPatch(target) }));
    toast(`Added ${lines.length} move${lines.length === 1 ? '' : 's'}`);
    closeSheet();
  };
  const sort = async () => {
    if (ctl.current) ctl.current.abort();
    ctl.current = new AbortController();
    setBusy(true); setErr('');
    try { const list = await sortDump(text, ctl.current.signal); setItems(list); if (!list.length) setErr('Claude didn’t find anything to add. Try adding more detail.'); }
    catch (e) { const m = aiError(e); if (m) setErr(m); }
    finally { setBusy(false); }
  };
  const dest = (it) => {
    if (it.goalId) return C('goals').get(it.goalId).title;
    if (it.projectId) return C('projects').get(it.projectId).title;
    if (it.newProject) return 'New project: ' + it.newProject.title;
    return 'Loose move';
  };
  const apply = () => {
    const made = new Map();
    let n = 0;
    for (const it of items.filter((x) => x.sel)) {
      let pid = it.projectId;
      if (!pid && it.newProject) {
        const k = it.newProject.title.toLowerCase();
        if (!made.has(k)) made.set(k, createDoc('projects', { title: it.newProject.title, area: it.newProject.area, why: '', ownerId: S.me, status: 'active' }));
        pid = made.get(k);
      }
      if (it.type === 'goal' && pid) addGoalWithActions(pid, { kind: 'goal', title: it.title, why: it.why, due: it.day, actions: it.actions });
      else newAction({ title: it.title, minutes: it.minutes, day: it.day, goalId: it.goalId, projectId: pid });
      n++;
    }
    toast(`Added ${n} item${n === 1 ? '' : 's'}`);
    closeSheet();
  };

  if (items && items.length) {
    const chosen = items.filter((x) => x.sel).length;
    return html`<${Sheet} title="Sorted" foot=${html`<button class="btn btn-pri" disabled=${!chosen} onClick=${apply}>Add ${chosen} item${chosen === 1 ? '' : 's'}</button><button class="btn" onClick=${() => setItems(null)}>Back</button>`}>
      <p class="hint">Claude chunked your dump into results and moves. Untick anything you don’t want.</p>
      <div>${items.map((it, i) => html`<label class="tick" key=${i}>
        <input type="checkbox" checked=${it.sel} onChange=${() => setItems(items.map((x, k) => (k === i ? { ...x, sel: !x.sel } : x)))}/>
        <span>
          <span class="kind">${it.type === 'goal' ? 'New goal' : 'Move'}</span>
          <b style="font-weight:600">${it.title}</b>
          <span class="row-meta"><span>${dest(it)}</span>${it.type === 'action' && html`<span class="num">${mins(it.minutes)}</span>`}${it.day && html`<span>${it.type === 'goal' ? dueText(it.day) : relDay(it.day)}</span>`}${it.actions.length > 0 && html`<span class="num">${it.actions.length} move${it.actions.length === 1 ? '' : 's'}</span>`}</span>
        </span>
      </label>`)}</div>
    <//>`;
  }

  return html`<${Sheet} title="Capture" foot=${html`
    <button class="btn btn-pri" disabled=${!lines.length || busy} onClick=${quickAdd}>Add ${lines.length > 1 ? lines.length + ' moves' : 'move'}</button>
    ${aiReady() && html`<button class="btn btn-ai" disabled=${!text.trim() || busy} onClick=${sort}><${Ic} n="spark" s=${16}/>Sort with Claude</button>`}`}>
    <textarea id="cap-text" class="textarea" rows="6" value=${text} onInput=${(e) => setText(e.currentTarget.value)} placeholder=${'Get it all out of your head. One per line, or a messy paragraph.\n\nOrder color stock 15m\nPost before/after photos\nIdea: loyalty card for regulars'} aria-label="What's on your mind" maxLength="6000"></textarea>
    ${busy && html`<${Thinking} text="Claude is sorting it into your projects…" onStop=${() => ctl.current && ctl.current.abort()}/>`}
    ${err && html`<p class="err" role="alert">${err}</p>`}
    <div class="field"><span>Add each line as a move for</span><${DayChips} value=${day} onChange=${setDay}/></div>
    <label class="field"><span>Under</span><${TargetSelect} id="cap-target" value=${target} onChange=${setTarget}/></label>
    ${aiReady() && html`<p class="hint">Or let Claude sort a messy dump: it files each item under the right project or goal, and proposes new goals where nothing fits.</p>`}
  <//>`;
}

function Big3Sheet({ slot }) {
  const [q, setQ] = useState('');
  const t = todayIso();
  const day = getLog(S.me, 'd-' + t) || {};
  const taken = new Set((day.big3 || []).filter(Boolean));
  const cands = big3Candidates().filter((a) => !taken.has(a.id));
  const candSet = new Set(cands.map((a) => a.id));
  const more = actions().filter((a) => a.ownerId === S.me && !a.done && !taken.has(a.id) && !candSet.has(a.id)).sort(byDone);
  const match = (a) => !q.trim() || a.title.toLowerCase().includes(q.trim().toLowerCase());
  const pick = (id) => { setBig(slot, id); closeSheet(); };
  const row = (a) => { const p = projectOf(a); const g = a.goalId && C('goals').get(a.goalId); return html`<button key=${a.id} class="row" style="width:100%" onClick=${() => pick(a.id)}>
    <span class="slot-n" aria-hidden="true" style="font-size:22px">${slot + 1}</span>
    <span class="row-main"><span class="row-title">${a.key && html`<span class="key"><${Ic} n="star" s=${13} fill/></span>`}${a.title}</span>
      <span class="row-meta">${p && html`<span class="ctx"><i style=${{ background: areaColor(p.area) }}></i>${g ? g.title : p.title}</span>`}${a.day && html`<span class=${a.day < t ? 'late' : ''}>${relDay(a.day)}</span>`}<span class="num">${mins(a.minutes || 30)}</span></span></span>
  </button>`; };
  const c1 = cands.filter(match), c2 = more.filter(match);
  return html`<${Sheet} title=${'Big 3 · move ' + (slot + 1)}>
    <form class="form" onSubmit=${(e) => { e.preventDefault(); const p = parseQuick(q); if (!p.title) return; const id = newAction({ ...p, day: t }); if (id) pick(id); }}>
      <input id="b3-q" class="input" value=${q} onInput=${(e) => setQ(e.currentTarget.value)} placeholder="Search your moves, or type a new one" aria-label="Search or add a move" autocomplete="off" enterkeyhint="go"/>
      ${q.trim() && html`<button class="btn btn-pri" type="submit" style="justify-self:start"><${Ic} n="plus" s=${16}/>Add “${parseQuick(q).title}” as a new move</button>`}
    </form>
    ${c1.length > 0 && html`<div class="field"><span class="label">Suggested: key, due, carried over, this week’s outcomes</span><div class="list">${c1.map(row)}</div></div>`}
    ${c2.length > 0 && html`<div class="field"><span class="label">All open moves</span><div class="list">${c2.slice(0, 40).map(row)}</div></div>`}
    ${!c1.length && !c2.length && html`<p class="hint">${q.trim() ? 'No match. Press enter to add it as a new move.' : 'No open moves yet. Type one above.'}</p>`}
  <//>`;
}

function FocusSheet({ week }) {
  const key = 'w-' + week;
  const focus = (getLog(S.me, key) || {}).focus || [];
  const active = goals().filter((g) => g.status === 'active');
  const mineFirst = (g) => (g.ownerId === S.me ? 0 : 1);
  const byProject = groupBy(active.sort((a, b) => mineFirst(a) - mineFirst(b) || (a.due || '9999').localeCompare(b.due || '9999')), (g) => g.projectId);
  const toggle = (id) => saveLog(key, { week, focus: focus.includes(id) ? focus.filter((x) => x !== id) : [...focus, id] });
  return html`<${Sheet} title="Outcomes this week" foot=${html`<button class="btn btn-pri" onClick=${closeSheet}>Done · ${focus.length} chosen</button>`}>
    <p class="hint">Which results would make this week a win? Three to five is plenty.${focus.length > 5 ? ' You have more than five: consider cutting.' : ''}</p>
    ${[...byProject.entries()].map(([pid, list]) => { const p = C('projects').get(pid); return html`<div class="field" key=${pid}>
      <span class="label">${p ? p.title : 'No project'}</span>
      <div>${list.map((g) => html`<label class="tick" key=${g.id}>
        <input type="checkbox" checked=${focus.includes(g.id)} onChange=${() => toggle(g.id)}/>
        <span><span>${g.title}</span><span class="row-meta">${g.due && html`<span class=${dueCls(g)}>${dueText(g.due)}</span>`}<span class="num">${progress(goalActions(g.id)).d}/${goalActions(g.id).length} moves</span>${g.ownerId && g.ownerId !== S.me && html`<span>${firstName(g.ownerId)}’s</span>`}</span></span>
      </label>`)}</div>
    </div>`; })}
    ${!active.length && html`<div class="empty"><span>No active goals yet. Create a project and give it a goal first.</span><button class="btn btn-sm btn-pri" onClick=${() => openSheet('goal', {})}>New goal</button></div>`}
  <//>`;
}

function LooseSheet() {
  const list = actions().filter((a) => !a.projectId && !a.goalId && !a.done && (whoId() ? a.ownerId === whoId() : true)).sort(byDone);
  return html`<${Sheet} title="Loose moves">
    <p class="hint">Moves that don’t belong to a project yet. Tap one to file it under a goal.</p>
    <div class="list">${list.map((a) => html`<${ActionRow} key=${a.id} a=${a} day=${true}/>`)}</div>
    ${!list.length && html`<p class="hint">All filed.</p>`}
  <//>`;
}

const SHEETS = { action: ActionSheet, goal: GoalSheet, project: ProjectSheet, suggest: SuggestSheet, moves: MovesSheet, breakdown: BreakdownSheet, capture: CaptureSheet, big3: Big3Sheet, focus: FocusSheet, loose: LooseSheet };

/* ───────────── App ───────────── */

function App() {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force((x) => x + 1); subs.add(f); f(); return () => subs.delete(f); }, []);
  useEffect(() => { refreshProfiles(); });
  useEffect(() => { try { localStorage.setItem('gs.ui', JSON.stringify({ tab: UI.tab, plan: UI.plan })); } catch (e) { /* storage unavailable */ } }, [UI.tab, UI.plan]);
  let view;
  if (UI.tab === 'plan') view = html`<${PlanView}/>`;
  else if (UI.tab === 'projects') view = UI.projectId ? html`<${ProjectDetail} key=${UI.projectId} id=${UI.projectId}/>` : html`<${ProjectsView}/>`;
  else if (UI.tab === 'crew') view = html`<${CrewView}/>`;
  else view = html`<${TodayView}/>`;
  const sh = UI.sheet;
  const SheetC = sh && SHEETS[sh.type];
  return html`<div class="shell"><${TopBar}/><${Banners}/><main>${view}</main></div>
    <${TabBar}/>
    ${SheetC && html`<${SheetC} key=${sh.key} ...${sh.props}/>`}
    ${UI.toast && html`<div class="toast" role="status">${UI.toast.msg}</div>`}`;
}

const use = (n) => {
  try { return window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
};

async function boot() {
  const el = document.getElementById('app');
  el.textContent = '';
  render(html`<${App}/>`, el);
  const userP = use('user');
  use('sample').then((s) => { S.ai = s; emit(); });
  const db = await use('db');
  const user = await userP;
  S.user = user;
  if (db) {
    DB = db; S.mode = 'live';
    S.me = user ? await user.id() : null;
    if (!S.me) S.readOnly = true;
    else { S.canWrite = user ? await user.can('data.write') : null; if (S.canWrite === false) S.readOnly = true; }
  } else {
    DB = memoryDb(); S.mode = 'local'; S.me = 'you'; S.user = null; S.profiles.you = { name: '' };
  }
  ['projects', 'goals', 'actions', 'people'].forEach(listen);
  if (S.me) listen(logCol(S.me));
  emit();
}
boot();
})();
</script>
